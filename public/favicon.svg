<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Dark Pill Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#060913" stroke="url(#glowGrad)" stroke-width="2"/>
  
  <!-- Neural / AI Nodes & Connections -->
  <circle cx="22" cy="22" r="4.5" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="42" cy="22" r="4.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="32" cy="42" r="5" fill="#8b5cf6" filter="url(#glow)"/>
  
  <!-- Glowing Connection Lines -->
  <line x1="22" y1="22" x2="42" y2="22" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="32" y2="42" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="22" x2="32" y2="42" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center Core Pulse Node -->
  <circle cx="32" cy="29" r="2.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
